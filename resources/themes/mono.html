<!--
  @portfolio-theme mono
  @description Swiss/Bauhaus typographic portfolio. Pure white, strict grid, titles below photos.
  @preview-bg      #ffffff
  @preview-surface #f2f2f2
  @preview-text    #111111
  @preview-muted   #e0e0e0
  @preview-font    Inter
  compatibility: portfolio-spec@1.4
-->

<style data-scope="global">
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #ffffff;
    --bg-2:     #f5f5f5;
    --text:     #111;
    --text-2:   #666;
    --text-3:   #bbb;
    --border:   #e8e8e8;
    --sans:     'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --max-w:    1100px;
    --nav-h:    52px;
    --pad:      40px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  /* ── Navigation ─────────────────────────────────────────────────────────── */
  .nav {
    position: sticky; top: 0;
    background: #fff;
    border-bottom: 1px solid var(--border);
    z-index: 100;
  }
  .nav__inner {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 var(--pad);
    height: var(--nav-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
  }
  .nav__logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .nav__links {
    display: flex; gap: 28px;
    list-style: none; align-items: center;
  }
  .nav__links a {
    font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--text-2);
    transition: color 0.15s;
  }
  .nav__links a:hover,
  .nav__links a.is-active { color: var(--text); }

  /* ── Page shell ─────────────────────────────────────────────────────────── */
  .page {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 var(--pad) 100px;
  }

  /* ── Footer ─────────────────────────────────────────────────────────────── */
  .footer {
    border-top: 1px solid var(--border);
    margin-top: 80px;
  }
  .footer__inner {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 24px var(--pad);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-size: 10.5px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .footer__social { display: flex; gap: 20px; }
  .footer a:hover { color: var(--text); }

  /* ── Fade animation ─────────────────────────────────────────────────────── */
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .u-fade   { animation: fadeIn 0.4s ease both; }
  .u-fade-2 { animation: fadeIn 0.4s 0.06s ease both; }
  .u-fade-3 { animation: fadeIn 0.4s 0.12s ease both; }
  .u-fade-4 { animation: fadeIn 0.4s 0.18s ease both; }

  /* ═══════════════════════════════════════
     HOME PAGE
  ═══════════════════════════════════════ */

  .home-intro {
    padding: 60px 0 48px;
    border-bottom: 1px solid var(--border);
  }
  .home-intro__name {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .home-intro__bio {
    font-size: 14px;
    color: var(--text-2);
    max-width: 480px;
    line-height: 1.7;
  }

  /* Albums — strict 3-col grid with index numbers */
  .albums-section {
    padding-top: 0;
  }

  .albums-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }

  .album-card {
    display: block;
    background: var(--bg);
    overflow: hidden;
    position: relative;
  }

  .album-card__img-wrap {
    aspect-ratio: 4/3;
    overflow: hidden;
    background: var(--bg-2);
  }

  .album-card__img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }

  .album-card:hover .album-card__img-wrap img {
    transform: scale(1.03);
  }

  .album-card__no-img {
    width: 100%;
    height: 100%;
    background: var(--bg-2);
  }

  /* Title always below photo */
  .album-card__meta {
    padding: 12px 14px 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    border-top: 1px solid var(--border);
  }

  .album-card__idx {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-3);
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }

  .album-card__title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    flex: 1;
  }

  .album-card__date {
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  /* Albums list view (fallback for no-cover) */
  .albums-list {
    display: none;
    flex-direction: column;
  }

  .album-row {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .album-row:first-child { border-top: 1px solid var(--border); }

  .album-row__idx {
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.06em;
    width: 28px;
    flex-shrink: 0;
    text-align: right;
  }

  .album-row__title {
    flex: 1;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .album-row__count {
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  .album-row__date {
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.04em;
    flex-shrink: 0;
    min-width: 60px;
    text-align: right;
  }

  /* ═══════════════════════════════════════
     ALBUM PAGE
  ═══════════════════════════════════════ */

  .album-header {
    padding: 52px 0 36px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }

  .album-header__eyebrow {
    font-size: 10.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-3);
    margin-bottom: 14px;
  }

  .album-header__title {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .album-header__meta {
    display: flex;
    gap: 24px;
    align-items: center;
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .album-header__desc {
    margin-top: 14px;
    font-size: 14px;
    color: var(--text-2);
    max-width: 520px;
    line-height: 1.7;
  }

  /* Photo grid — strict equal columns, title BELOW each photo */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-top: 1px;
  }

  .photo-item {
    display: block;
    cursor: zoom-in;
    background: var(--bg);
    overflow: hidden;
    position: relative;
  }

  .photo-item__img-wrap {
    aspect-ratio: 1;
    overflow: hidden;
    background: var(--bg-2);
  }

  .photo-item__img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.2s;
  }
  .photo-item:hover .photo-item__img-wrap img {
    opacity: 0.85;
  }

  .photo-item__caption {
    padding: 8px 10px;
    font-size: 10.5px;
    color: var(--text-3);
    letter-spacing: 0.03em;
    border-top: 1px solid var(--border);
    min-height: 30px;
  }

  /* ── Lightbox ─────────────────────────────────────────────────────────── */
  .lb {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.96);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .lb--open { display: flex; }
  .lb__img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
  .lb__close {
    position: absolute; top: 20px; right: 24px;
    font-size: 24px; color: #fff; cursor: pointer;
    background: none; border: none; line-height: 1;
    font-family: var(--sans); font-weight: 300;
  }
  .lb__prev, .lb__next {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 20px; color: rgba(255,255,255,0.5);
    background: none; border: none; cursor: pointer; padding: 20px;
    font-family: var(--sans);
  }
  .lb__prev { left: 0; }
  .lb__next { right: 0; }

  /* ═══════════════════════════════════════
     ABOUT PAGE
  ═══════════════════════════════════════ */

  .about-wrap {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 60px;
    padding-top: 60px;
  }

  .about-photo img {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
  }

  .about-body {
    padding-top: 4px;
  }

  .about-eyebrow {
    font-size: 10.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-3);
    margin-bottom: 16px;
  }

  .about-name {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .about-bio {
    margin-top: 24px;
    font-size: 14.5px;
    color: var(--text-2);
    line-height: 1.75;
    max-width: 560px;
  }

  .about-social {
    margin-top: 32px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .about-social a {
    font-size: 10.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-2);
    border-bottom: 1px solid var(--border);
    padding-bottom: 2px;
    transition: color 0.15s, border-color 0.15s;
  }
  .about-social a:hover { color: var(--text); border-color: var(--text); }

  /* Responsive ─────────────────────────────────────────────────────────── */
  @media (max-width: 900px) {
    :root { --pad: 24px; }
    .albums-grid { grid-template-columns: repeat(2, 1fr); }
    .photo-grid  { grid-template-columns: repeat(2, 1fr); }
    .about-wrap  { grid-template-columns: 1fr; gap: 32px; }
    .about-photo img { aspect-ratio: 16/9; }
  }

  @media (max-width: 600px) {
    :root { --pad: 16px; }
    .albums-grid { grid-template-columns: 1fr; }
    .photo-grid  { grid-template-columns: 1fr; }
    .nav__links  { display: none; }
  }
</style>

<!-- ═══════════════════════════════════ HOME ═══════════════════════════════════ -->
<template data-page="home">
  <nav class="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo">{{site.owner.name}}</a>
      <ul class="nav__links">
        {{#unless (eq site.nav.homeVisible false)}}<li><a href="/">Work</a></li>{{/unless}}
      {{#unless (eq site.nav.aboutVisible false)}}<li><a href="/about">About</a></li>{{/unless}}
      {{#if site.nav.links}}{{#each site.nav.links}}<li><a href="{{url}}">{{label}}</a></li>{{/each}}{{/if}}
      </ul>
    </div>
  </nav>

  <main class="page">
    <div class="home-intro u-fade">
      <h1 class="home-intro__name">{{site.owner.name}}</h1>
      {{#if site.owner.bio}}<p class="home-intro__bio">{{site.owner.bio}}</p>{{/if}}
    </div>

    <section class="albums-section u-fade-2">
      {{#if albums}}
      <div class="albums-grid">
        {{#each albums}}
        <a class="album-card" href="{{albumUrl this}}">
          <div class="album-card__img-wrap">
            {{#if (coverUrl this)}}
            <img src="{{coverUrl this}}" alt="{{this.title}}" loading="lazy">
            {{else}}
            <div class="album-card__no-img"></div>
            {{/if}}
          </div>
          <div class="album-card__meta">
            <span class="album-card__idx">{{add @index 1}}</span>
            <span class="album-card__title">{{this.title}}</span>
            <span class="album-card__date">{{formatDate this.date}}</span>
          </div>
        </a>
        {{/each}}
      </div>
      {{/if}}
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span>{{site.owner.name}}</span>
      <div class="footer__social">
        {{#if site.social.instagram}}<a href="https://instagram.com/{{site.social.instagram}}" target="_blank" rel="noopener">Instagram</a>{{/if}}
        {{#if site.social.facebook}}<a href="https://facebook.com/{{site.social.facebook}}" target="_blank" rel="noopener">Facebook</a>{{/if}}
        {{#if site.social.email}}<a href="mailto:{{site.social.email}}">Email</a>{{/if}}
      </div>
    </div>
  </footer>
  {{inject-script}}
  {{inject-style}}
</template>

<!-- ═══════════════════════════════════ ALBUM ══════════════════════════════════ -->
<template data-page="album">
  <nav class="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo">{{site.owner.name}}</a>
      <ul class="nav__links">
        {{#unless (eq site.nav.homeVisible false)}}<li><a href="/">Work</a></li>{{/unless}}
      {{#unless (eq site.nav.aboutVisible false)}}<li><a href="/about">About</a></li>{{/unless}}
      {{#if site.nav.links}}{{#each site.nav.links}}<li><a href="{{url}}">{{label}}</a></li>{{/each}}{{/if}}
      </ul>
    </div>
  </nav>

  <main class="page">
    <div class="album-header u-fade">
      <p class="album-header__eyebrow">Album</p>
      <h1 class="album-header__title">{{album.title}}</h1>
      <div class="album-header__meta">
        <span>{{formatDate album.date}}</span>
        <span>{{photoCount album}} photos</span>
      </div>
      {{#if album.description}}<p class="album-header__desc">{{album.description}}</p>{{/if}}
    </div>

    <div class="photo-grid u-fade-2" id="photo-grid">
      {{#each album.photos}}
      <a class="photo-item" href="{{imageUrl this}}" data-lb-index="{{@index}}">
        <div class="photo-item__img-wrap">
          <img src="{{thumbUrl this}}" alt="{{this.altText}}" loading="lazy">
        </div>
        {{#if this.caption}}<p class="photo-item__caption">{{this.caption}}</p>{{/if}}
      </a>
      {{/each}}
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <a href="/">← {{site.title}}</a>
      <span>{{formatDate album.date}}</span>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lb" id="lb">
    <button class="lb__close" id="lb-close">×</button>
    <button class="lb__prev" id="lb-prev">‹</button>
    <img class="lb__img" id="lb-img" src="" alt="">
    <button class="lb__next" id="lb-next">›</button>
  </div>

  <script>
  (function(){
    var photos=[{{#each album.photos}}{full:"{{imageUrl this}}",thumb:"{{thumbUrl this}}",alt:"{{this.altText}}"}{{#unless @last}},{{/unless}}{{/each}}];
    var lb=document.getElementById('lb'),img=document.getElementById('lb-img');
    var cur=0;
    function show(i){cur=(i+photos.length)%photos.length;img.src=photos[cur].full;img.alt=photos[cur].alt||'';lb.classList.add('lb--open');}
    document.querySelectorAll('.photo-item').forEach(function(el){
      el.addEventListener('click',function(e){e.preventDefault();show(+el.dataset.lbIndex);});
    });
    document.getElementById('lb-close').onclick=function(){lb.classList.remove('lb--open');};
    document.getElementById('lb-prev').onclick=function(){show(cur-1);};
    document.getElementById('lb-next').onclick=function(){show(cur+1);};
    lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('lb--open');});
    document.addEventListener('keydown',function(e){
      if(!lb.classList.contains('lb--open'))return;
      if(e.key==='ArrowLeft')show(cur-1);
      else if(e.key==='ArrowRight')show(cur+1);
      else if(e.key==='Escape')lb.classList.remove('lb--open');
    });
  })();
  </script>
  {{inject-script}}
  {{inject-style}}
</template>

<!-- ═══════════════════════════════════ ABOUT ══════════════════════════════════ -->
<template data-page="about">
  <nav class="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo">{{site.owner.name}}</a>
      <ul class="nav__links">
        {{#unless (eq site.nav.homeVisible false)}}<li><a href="/">Work</a></li>{{/unless}}
      {{#unless (eq site.nav.aboutVisible false)}}<li><a href="/about">About</a></li>{{/unless}}
      {{#if site.nav.links}}{{#each site.nav.links}}<li><a href="{{url}}">{{label}}</a></li>{{/each}}{{/if}}
      </ul>
    </div>
  </nav>

  <main class="page">
    <div class="about-wrap">
      {{#if site.owner.avatar}}
      <div class="about-photo u-fade">
        <img src="{{site.owner.avatar}}" alt="{{site.owner.name}}">
      </div>
      {{/if}}
      <div class="about-body u-fade-2">
        <p class="about-eyebrow">About</p>
        <h1 class="about-name">{{site.owner.name}}</h1>
        {{#if site.owner.bio}}<p class="about-bio">{{site.owner.bio}}</p>{{/if}}
        <div class="about-social">
          {{#if site.social.instagram}}<a href="https://instagram.com/{{site.social.instagram}}" target="_blank" rel="noopener">Instagram</a>{{/if}}
          {{#if site.social.facebook}}<a href="https://facebook.com/{{site.social.facebook}}" target="_blank" rel="noopener">Facebook</a>{{/if}}
          {{#if site.social.email}}<a href="mailto:{{site.social.email}}">Email</a>{{/if}}
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span>{{site.owner.name}}</span>
    </div>
  </footer>
  {{inject-script}}
  {{inject-style}}
</template>

<script data-scope="global">
(function(){
  var els=document.querySelectorAll('.album-card,.photo-item');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.style.opacity=1;});return;}
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){en.target.style.opacity=1;io.unobserve(en.target);}
    });
  },{threshold:0.08});
  els.forEach(function(e){e.style.opacity=0;e.style.transition='opacity 0.4s ease';io.observe(e);});
})();
</script>
